<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 268px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12.5px;
    color: #1f2328;
    background: #fff;
  }
  .h {
    padding: 10px 12px;
    border-bottom: 1px solid #eaeef2;
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .switch { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-weight: 400; font-size: 11.5px; color: #57606a; cursor: pointer; }
  .b { padding: 10px 12px; }
  .lb { font-size: 11px; color: #57606a; font-weight: 600; margin-bottom: 5px; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  button {
    border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f;
    border-radius: 999px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
    font-family: inherit;
  }
  button.on { background: #0969da; border-color: #0969da; color: #fff; font-weight: 600; }
  .go {
    display: block; width: 100%; border-radius: 6px; padding: 7px;
    background: #1f883d; border-color: #1f883d; color: #fff; font-weight: 600;
  }
  .meta { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #eaeef2; color: #8c959f; font-size: 10.5px; line-height: 1.5; }
  .tip { color: #57606a; font-size: 11px; line-height: 1.55; }
</style>
</head>
<body>
  <div class="h">
    DBLP 等级筛选器
    <label class="switch"><input type="checkbox" id="enabled"> 启用</label>
  </div>
  <div class="b">
    <div class="lb">快速筛选方案</div>
    <div class="pills" id="presets"></div>
    <button class="go" id="go">打开「med vqa」搜索结果</button>
    <div class="meta" id="meta">数据加载中…</div>
    <div class="tip" style="margin-top:8px">
      筛选面板在 DBLP 搜索结果页右上角，快捷键 <b>Alt+F</b> 收起/展开。
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
